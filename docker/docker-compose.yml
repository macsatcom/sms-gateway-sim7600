services:
  sms-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    devices:
      - ${MODEM_PORT:-/dev/ttyUSB2}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    volumes:
      - sms_data:/data
    environment:
      MODEM_PORT:  ${MODEM_PORT:-/dev/ttyUSB2}
      BAUD_RATE:   ${BAUD_RATE:-115200}
      CMD_TIMEOUT: ${CMD_TIMEOUT:-5.0}
      API_PORT:    ${API_PORT:-8000}
      API_KEYS:    ${API_KEYS:-}
      API_KEY:     ${API_KEY:-}
      SIM_PIN:     ${SIM_PIN:-}
      LOG_DB:      ${LOG_DB:-/data/sms-gateway.db}
      DEBUG:       ${DEBUG:-0}
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sms_data:
